<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${formTitle} + ' | Book Library'">Book Form</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
  <a th:href="@{/}" class="nav-brand">📚 Book Library</a>
</nav>

<div class="container">
  <a th:href="@{/}" class="back-link">← Back to Library</a>

  <div class="form-card">
    <h2 th:text="${formTitle}">Book Form</h2>

    <form th:action="${book.id != null} ? @{/books/{id}/edit(id=${book.id})} : @{/books/new}"
          th:object="${book}" method="post" class="book-form">

      <div class="form-row">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" th:field="*{title}" placeholder="Book title" class="form-control"
                 th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"/>
          <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>
        <div class="form-group">
          <label>Author *</label>
          <input type="text" th:field="*{author}" placeholder="Author name" class="form-control"
                 th:classappend="${#fields.hasErrors('author')} ? 'is-invalid' : ''"/>
          <span class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>ISBN *</label>
          <input type="text" th:field="*{isbn}" placeholder="e.g. 9780134494166" class="form-control"
                 th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid' : ''"/>
          <span class="error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></span>
        </div>
        <div class="form-group">
          <label>Genre</label>
          <select th:field="*{genre}" class="form-control">
            <option value="">— Select genre —</option>
            <option value="Fiction">Fiction</option>
            <option value="Non-Fiction">Non-Fiction</option>
            <option value="Science Fiction">Science Fiction</option>
            <option value="Dystopia">Dystopia</option>
            <option value="Technology">Technology</option>
            <option value="Biography">Biography</option>
            <option value="History">History</option>
            <option value="Mystery">Mystery</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Published Year</label>
          <input type="number" th:field="*{publishedYear}" placeholder="e.g. 2023"
                 min="1000" max="2100" class="form-control"/>
          <span class="error" th:if="${#fields.hasErrors('publishedYear')}" th:errors="*{publishedYear}"></span>
        </div>
        <div class="form-group">
          <label>Rating (0–5)</label>
          <input type="number" th:field="*{rating}" placeholder="e.g. 4.5"
                 step="0.1" min="0" max="5" class="form-control"/>
          <span class="error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></span>
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea th:field="*{description}" rows="4" class="form-control"
                  placeholder="Brief description of the book…"></textarea>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" th:field="*{available}"/> Mark as Available
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" th:text="${book.id != null} ? 'Update Book' : 'Add Book'">Submit</button>
        <a th:href="@{/}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>

<footer class="footer">
  <p>Book Library App &mdash; Built with Spring Boot &amp; Thymeleaf</p>
</footer>
</body>
</html>
